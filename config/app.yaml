# Parâmetros não secretos e alteráveis (versionado). Segredos ficam em .env (nunca versionado).
# Ver AGENTS.md (A7).

attachments:
  max_size_mb: 5

trello:
  # Orçamento abaixo do limite oficial de 100 req/10 s por token,
  # com backoff exponencial em HTTP 429.
  rate_limit:
    requests_per_10s: 40
    backoff: exponential
  priority_labels:
    - "Muito alta"
    - "Alta"
    - "Média"
    - "Baixa"
    - "Muito baixa"

session:
  duration_days: 90
  # Flag Secure dos cookies (S3). Fica `false` em desenvolvimento (acesso HTTP na LAN)
  # e DEVE ser `true` em produção (HTTPS obrigatório, S7).
  # Obs.: o carregamento deste YAML ainda não está ligado — hoje o valor vem da
  # variável de ambiente COOKIE_SECURE (default: false).
  cookie_secure: false

ui:
  default_board: last_used
