# Pacote de produção — roteiro em specs/011-publicacao-em-producao/quickstart.md
#
# O TLS e o acesso são da camada de rede privada (Tailscale): ver docs/adr/0005-acesso-por-rede-privada.md.
# Por isso NENHUMA porta vai para a internet:
#   - o proxy escuta apenas no loopback (127.0.0.1:80) e quem fala com ele é o `tailscaled`;
#   - o servidor (8000) fica só na rede interna do compose;
#   - quem publica em HTTPS para os aparelhos do tailnet é o `tailscale serve`.
# Segredos vêm de ./deploy/.env, que fica no servidor e nunca entra no Git (FR-004).
name: myplanner

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # A ponta que o navegador vê é HTTPS (S3/S7): o cookie de sessão é Secure.
      COOKIE_SECURE: "true"
      TZ: America/Sao_Paulo
    volumes:
      # Hash da senha criado no primeiro acesso: sobrevive a rebuilds (FR-006/FR-011).
      - app_data:/app/backend/.data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  proxy:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      TZ: America/Sao_Paulo
    ports:
      # Só no loopback: exposição à internet igual a zero. O `tailscale serve` encaminha para cá.
      - "127.0.0.1:80:80"

volumes:
  app_data:

