# Modo bootstrap: existe apenas enquanto o certificado do IP ainda não foi emitido.
# Nada da aplicação é servido em HTTP — só o desafio do certificado (FR-008).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo o resto fica indisponível até o certificado existir: nada de app em HTTP.
    location / {
        return 503;
    }
}
