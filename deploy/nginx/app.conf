# Proxy interno do app (HTTP apenas no loopback) — ver docs/adr/0005-acesso-por-rede-privada.md.
#
# Quem termina o TLS é o `tailscaled` (`tailscale serve`), que fala com este proxy em 127.0.0.1:80.
# Por isso aqui NÃO existe bloco 443, nem redirecionamento, nem desafio ACME: nada disso é nosso.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # O app não recebe upload grande nesta versão: um limite pequeno fecha a porta para abuso.
    client_max_body_size 2m;

    # HSTS com validade modesta, de propósito: se um dia o HTTPS do tailnet for desativado, o navegador
    # não fica travado por um ano num nome que deixou de responder.
    add_header Strict-Transport-Security "max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # API: mesma regra do proxy de desenvolvimento — o PWA chama /api e o prefixo é removido.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # PWA: os arquivos do build do frontend.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # O index e o service worker não podem envelhecer, senão a versão nova demora a chegar (FR-009).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
}
