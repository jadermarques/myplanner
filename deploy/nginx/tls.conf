# Modo definitivo: HTTPS com o certificado do IP — ver specs/011-publicacao-em-producao/plan.md.
# ${PUBLIC_HOST} é substituído pelo seletor de modo (deploy/proxy-entrypoint.sh).

# 80: serve APENAS o desafio do certificado (HTTP-01, RFC 8738) e redireciona o resto para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443: o app. Nada da aplicação é servido em HTTP.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Os estáticos não passam pelo middleware do app: a política de segurança é aplicada aqui (S7).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Nenhum upload grande nesta versão: um limite pequeno fecha a porta para abuso.
    client_max_body_size 2m;

    # API: mesma regra do proxy de desenvolvimento — o PWA chama /api e o prefixo é removido.
    # O servidor nunca é publicado: só este proxy fala com ele, pela rede interna.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # PWA: os arquivos do build do frontend.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # O index e o service worker não podem ser guardados por muito tempo, senão a versão nova
    # demora a chegar no celular (FR-009).
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }
}
